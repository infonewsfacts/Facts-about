<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>FactCues Love Tips Post Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700;800;900&family=Poppins:wght@500;700;800;900&family=Anton&display=swap" rel="stylesheet">
<link href="fonts.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #121212;
    font-family: -apple-system, Roboto, 'Segoe UI', sans-serif;
    color: #fff;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    padding: 8px 10px 0;
    overflow: hidden;
  }
  h1 {
    font-size: 13px;
    text-align: center;
    margin: 0 0 6px;
    font-weight: 600;
    color: #eee;
    letter-spacing: 0.4px;
    flex: 0 0 auto;
  }
  .canvas-container {
    position: relative;
    flex: 0 0 auto;
    width: min(100%, calc(56vh * 0.8));
    aspect-ratio: 4 / 5;
    margin: 0 auto;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  canvas#card { width: 100%; height: 100%; display: block; }
  .placeholder-btn {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 13px;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .divider {
    position: absolute;
    left: 0; right: 0;
    height: 28px;
    margin-top: -14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: ns-resize;
    z-index: 5;
  }
  .divider .bar {
    width: 44px;
    height: 5px;
    background: #ec407a;
    border-radius: 3px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.35);
  }
  .hint {
    font-size: 11px;
    color: #777;
    text-align: center;
    margin-top: 4px;
    flex: 0 0 auto;
    line-height: 1.3;
  }
  .controls {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 16px;
  }
  .row { display: flex; gap: 8px; }
  .ratio-row button { padding: 8px 4px; font-size: 12px; }
  .mode-row button.active { background: #ec407a; border-color: #ec407a; }
  .ratio-row button.active { background: #1877F2; border-color: #1877F2; }
  button {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 9px 8px;
    font-size: 13px;
    font-weight: 600;
  }
  button:active { background: #3a3a3a; }
  button.primary { background: #ec407a; border-color: #ec407a; }
  button.primary:active { background: #d81b60; }
  textarea, input[type=text] {
    width: 100%;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  textarea { resize: none; min-height: 52px; }
  label.small {
    font-size: 11px;
    color: #aaa;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  label.small span.t { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; margin: 0; height: 18px; }
  #fileInput { display: none; }
  .wm-box {
    display: none !important;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    background: #181818;
    border: 1px solid #2f2f2f;
    border-radius: 10px;
  }
  .wm-title { font-size: 12px; font-weight: 700; color: #ccc; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💞 FactCues • Relationship &amp; Dating Tips Maker</h1>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="card" width="1080" height="1350"></canvas>
    <div class="placeholder-btn" id="placeholderHint">Neeche button se image select karein</div>
    <div class="divider" id="divider"><div class="bar"></div></div>
  </div>
  <div class="hint">📌 Image drag karein • divider ko upar-neeche karke text area adjust karein</div>

  <div class="controls">
    <div class="row">
      <button id="pickImageBtn">📷 Image</button>
      <button id="saveBtn" class="primary">💾 Save Post</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <div class="row ratio-row mode-row" id="modeRow">
      <button data-m="classic" class="active">🌙 Classic</button>
      <button data-m="top">⬆️ Top Text</button>
    </div>

    <div class="row ratio-row" id="ratioRow">
      <button data-r="45" class="active">4:5</button>
      <button data-r="11">1:1</button>
      <button data-r="916">9:16</button>
      <button data-r="191">1.91:1</button>
    </div>

    <textarea id="factText" placeholder="Yahan apna relationship / dating tip likhein... (Facebook post style: hook + emoji)"></textarea>

    <div class="row">
      <label class="small"><span class="t"><span>Font</span><span><span id="fontSizeVal">52</span>px</span></span>
        <input type="range" id="fontSize" min="20" max="100" value="52" />
      </label>
      <label class="small"><span class="t"><span>Zoom</span><span><span id="zoomVal">100</span>%</span></span>
        <input type="range" id="zoom" min="100" max="300" value="100" />
      </label>
    </div>

    <div id="topControls" style="display:none; flex-direction:column; gap:8px;">
      <div class="row">
        <button id="topMinus">A− Chhota</button>
        <button id="topPlus">A+ Bada</button>
      </div>
      <div class="row">
        <button id="topFitBtn">↔️ Fit Lines: ON</button>
        <button id="topShrinkBtn">📏 Auto Shrink: OFF</button>
      </div>
      <label class="small"><span class="t"><span>Line Gap</span><span><span id="topGapVal">1.2</span>x</span></span>
        <input type="range" id="topGap" min="80" max="180" value="120" />
      </label>
    </div>

    <div class="wm-box">
      <div class="wm-title">🏷️ Watermark</div>
      <input type="text" id="watermarkInput" value="" placeholder="Watermark text" />
      <div class="row">
        <label class="small"><span class="t"><span>Size</span><span><span id="wmSizeVal">26</span>px</span></span>
          <input type="range" id="wmSize" min="16" max="56" value="26" />
        </label>
        <label class="small"><span class="t"><span>Opacity</span><span><span id="wmOpacityVal">92</span>%</span></span>
          <input type="range" id="wmOpacity" min="30" max="100" value="92" />
        </label>
      </div>
      <div class="row">
        <button id="wmPosBtn">📍 Position: Top Right</button>
        <button id="wmToggleBtn">👁️ Show: OFF</button>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');
  const divider = document.getElementById('divider');
  const placeholderHint = document.getElementById('placeholderHint');
  const factText = document.getElementById('factText');
  const fontSizeInput = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const zoomInput = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const fileInput = document.getElementById('fileInput');
  const watermarkInput = document.getElementById('watermarkInput');

  // 4:5 portrait canvas. Image on TOP, black text area on BOTTOM.
  let W = 1080;
  let H = 1350;
  const RATIOS = {
    '45':  { w: 1080, h: 1350, font: 52, name: '4x5' },
    '11':  { w: 1080, h: 1080, font: 52, name: '1x1' },
    '916': { w: 1080, h: 1920, font: 60, name: '9x16' },
    '191': { w: 1200, h: 630,  font: 32, name: '1.91x1' }
  };
  let ratioName = '4x5';
  const FONT_STACK = '"Noto Sans Devanagari", "Poppins", Arial, sans-serif';

  const state = {
    image: null,
    splitRatio: 0.6,
    mode: 'classic',
    splitClassic: 0.6,
    splitTop: 0.4,
    topFit: true,
    topShrink: false,
    topGap: 1.2,
    imgH: 0,
    splitY: 0,
    fontSize: 52,
    text: factText.value,
    zoom: 1,
    centerX: null,
    centerY: null,
    cropW: null,
    cropH: null,
    watermarkText: '',
    wmSize: 26,
    wmOpacity: 0.92,
    wmPos: 0,
    wmVisible: false
  };

  // ---- Title Case (display only) ----
  const SMALL_WORDS = new Set([
    'a','an','the','and','but','or','nor','for','so','yet','as','at','by','in',
    'of','off','on','per','to','up','via','vs','with','from','into','than'
  ]);

  function titleCaseWord(word, index, total) {
    const m = word.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}][\s\S]*)$/u);
    if (!m) return word;
    const lead = m[1];
    const rest = m[2];
    const core = rest.replace(/[^\p{L}\p{N}]+$/u, '').toLowerCase();
    const isEdge = index === 0 || index === total - 1;
    if (!isEdge && SMALL_WORDS.has(core)) {
      return lead + rest.charAt(0).toLowerCase() + rest.slice(1);
    }
    return lead + rest.charAt(0).toUpperCase() + rest.slice(1);
  }

  function getWordList(text) {
    return (text.match(/\S+/g) || []);
  }

  function buildTokens(text) {
    const words = getWordList(text);
    return words.map((w, i) => ({ text: titleCaseWord(w, i, words.length), color: '#ffffff' }));
  }

  function wrapTokens(context, tokens, maxWidth) {
    const spaceWidth = context.measureText(' ').width;
    const lines = [];
    let currentLine = [];
    let currentWidth = 0;
    tokens.forEach((tok, idx) => {
      const w = context.measureText(tok.text).width;
      const addWidth = currentLine.length ? spaceWidth + w : w;
      if (currentWidth + addWidth > maxWidth && currentLine.length) {
        lines.push(currentLine);
        currentLine = [{ ...tok, width: w, wordIndex: idx }];
        currentWidth = w;
      } else {
        currentLine.push({ ...tok, width: w, wordIndex: idx });
        currentWidth += addWidth;
      }
    });
    if (currentLine.length) lines.push(currentLine);
    return lines;
  }

  // ---- Watermark (pill badge) ----
  const WM_POSITIONS = [
    { key: 'top-right',    label: 'Top Right' },
    { key: 'top-left',     label: 'Top Left' },
    { key: 'img-right',    label: 'Image Bottom Right' },
    { key: 'img-left',     label: 'Image Bottom Left' },
    { key: 'card-bottom',  label: 'Card Bottom Center' }
  ];
  const WM_ACCENT = '#2196F3';
  const WM_MARGIN = 28;

  function measureWatermark(text) {
    if (!text) return { w: 0, h: 0, textW: 0, size: 0 };
    const size = state.wmSize;
    ctx.save();
    ctx.font = `700 ${size}px ${FONT_STACK}`;
    const textW = ctx.measureText(text).width;
    ctx.restore();
    const padX = size * 0.5;
    const dotR = size * 0.14;
    const gap = size * 0.32;
    const h = size * 1.35;
    const w = padX + dotR * 2 + gap + textW + padX;
    return { w, h, textW, size, padX, dotR, gap };
  }

  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.arcTo(x + w, y, x + w, y + r, r);
    c.lineTo(x + w, y + h - r);
    c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h);
    c.arcTo(x, y + h, x, y + h - r, r);
    c.lineTo(x, y + r);
    c.arcTo(x, y, x + r, y, r);
    c.closePath();
  }

  function drawWatermark(text, m, imgAreaH) {
    const key = WM_POSITIONS[state.wmPos].key;
    let x, y;
    switch (key) {
      case 'top-left':    x = WM_MARGIN; y = WM_MARGIN; break;
      case 'img-right':   x = W - WM_MARGIN - m.w; y = imgAreaH - WM_MARGIN - m.h; break;
      case 'img-left':    x = WM_MARGIN; y = imgAreaH - WM_MARGIN - m.h; break;
      case 'card-bottom': x = (W - m.w) / 2; y = H - 30 - m.h; break;
      default:            x = W - WM_MARGIN - m.w; y = WM_MARGIN;
    }

    ctx.save();
    ctx.globalAlpha = state.wmOpacity;

    // Pill background with soft shadow
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 3;
    roundRectPath(ctx, x, y, m.w, m.h, m.h / 2);
    ctx.fillStyle = 'rgba(12,12,12,0.55)';
    ctx.fill();

    // Thin light border
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.stroke();

    // Accent dot with glow ring
    const cx = x + m.padX + m.dotR;
    const cy = y + m.h / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, m.dotR * 1.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(33,150,243,0.28)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, m.dotR, 0, Math.PI * 2);
    ctx.fillStyle = WM_ACCENT;
    ctx.fill();

    // Text
    ctx.font = `700 ${m.size}px ${FONT_STACK}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, x + m.padX + m.dotR * 2 + m.gap, cy + m.size * 0.04);
    ctx.restore();
  }

  // ---- TOP TEXT layout: white text area on top, image below (4:5) ----
  const TOP_FONT = '"Anton", "Noto Sans Devanagari", Impact, "Arial Narrow", sans-serif';
  const TOP_MAX_BOOST = 1.3;

  // Anton loaded? If not (offline), fall back to heavy system bold so text stays thick
  function topWeight() {
    ctx.font = '400 100px "Anton", monospace';
    const a = ctx.measureText('MWmw').width;
    ctx.font = '400 100px monospace';
    const b = ctx.measureText('MWmw').width;
    return Math.abs(a - b) > 0.5 ? 400 : 900;
  }

  function layoutTopLines(words, scale, maxWidth) {
    const base = state.fontSize * scale;
    ctx.font = `${topWeight()} ${base}px ${TOP_FONT}`;
    const tokens = words.map((w, i) => ({ text: titleCaseWord(w, i, words.length) }));
    const spaceW = ctx.measureText(' ').width;

    // Manual line breaks (Enter in the text box): each paragraph wraps on its own
    const breaks = getBreakCounts(state.text);
    const lines = [];
    let group = [], groupStart = 0;
    const flush = () => {
      if (!group.length) return;
      wrapTokens(ctx, group, maxWidth).forEach(line => {
        line.forEach(t => { t.wordIndex += groupStart; });
        lines.push(line);
      });
      group = [];
    };
    tokens.forEach((tok, i) => {
      if (i > 0 && breaks[i] > 0) {
        flush();
        for (let b = 1; b < breaks[i]; b++) lines.push([]); // blank line for extra Enter
        groupStart = i;
      }
      group.push(tok);
    });
    flush();

    return lines.map(line => {
      if (!line.length) return { tokens: [], base, size: base * 0.6, wBase: 0, spaceW };
      const wBase = line.reduce((sum, t, idx) => sum + t.width + (idx > 0 ? spaceW : 0), 0);
      const fitSize = base * (maxWidth / Math.max(wBase, 1));
      const size = state.topFit ? Math.min(base * TOP_MAX_BOOST, fitSize) : Math.min(base, fitSize);
      return { tokens: line, base, size, wBase, spaceW };
    });
  }

  // number of line breaks before each word (0 = same line)
  function getBreakCounts(text) {
    const out = [];
    const re = /\S+/g;
    let m, last = 0;
    while ((m = re.exec(text)) !== null) {
      const gap = text.slice(last, m.index);
      out.push((gap.match(/\n/g) || []).length);
      last = m.index + m[0].length;
    }
    return out;
  }

  function drawTopCard() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const splitY = Math.round(H * state.splitRatio);
    state.splitY = splitY;
    const imgH = H - splitY;
    state.imgH = imgH;

    // ---- IMAGE (bottom) ----
    ctx.fillStyle = '#e9e9e9';
    ctx.fillRect(0, splitY, W, imgH);
    if (state.image) {
      const img = state.image;
      const targetRatio = W / imgH;
      const imgRatio = img.width / img.height;
      let baseW, baseH;
      if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
      else { baseW = img.width; baseH = baseW / targetRatio; }
      const cropW = baseW / state.zoom;
      const cropH = baseH / state.zoom;
      state.centerX = Math.max(cropW / 2, Math.min(state.centerX, img.width - cropW / 2));
      state.centerY = Math.max(cropH / 2, Math.min(state.centerY, img.height - cropH / 2));
      state.cropW = cropW;
      state.cropH = cropH;
      ctx.drawImage(img, state.centerX - cropW / 2, state.centerY - cropH / 2, cropW, cropH, 0, splitY, W, imgH);
    }

    // ---- TEXT (top) ----
    const words = getWordList(state.text);
    if (words.length) {
      const maxWidth = W - 120;
      const availH = splitY - 50;
      let scale = 1, lines = [], total = 0;
      for (let k = 0; k < 14; k++) {
        lines = layoutTopLines(words, scale, maxWidth);
        total = lines.reduce((a, l) => a + l.size * state.topGap, 0);
        if (!state.topShrink || total <= availH) break;
        scale *= 0.92;
      }
      let y = total <= splitY ? (splitY - total) / 2 : 10;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      lines.forEach(l => {
        const k = l.size / l.base;
        const lineH = l.size * state.topGap;
        const cy = y + lineH / 2 + l.size * 0.04;
        const lineW = l.wBase * k;
        const gap = l.spaceW * k;
        ctx.font = `${topWeight()} ${l.size}px ${TOP_FONT}`;
        let x = W / 2 - lineW / 2;
        l.tokens.forEach(tok => {
          const tw = tok.width * k;
          ctx.fillStyle = '#000000';
          ctx.fillText(tok.text, x, cy);
          x += tw + gap;
        });
        y += lineH;
      });
    }

    const displayRatio = container.clientHeight / H;
    divider.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.height = (imgH * displayRatio) + 'px';
    placeholderHint.style.display = state.image ? 'none' : 'flex';
  }

  function drawCard() {
    if (state.mode === 'top') { drawTopCard(); return; }
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const splitY = Math.round(H * state.splitRatio);
    state.splitY = splitY;
    const imgAreaH = splitY;
    const textAreaH = H - splitY;

    // ---- IMAGE AREA ----
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, imgAreaH);

    if (state.image) {
      const img = state.image;
      const targetRatio = W / imgAreaH;
      const imgRatio = img.width / img.height;

      let baseW, baseH;
      if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
      else { baseW = img.width; baseH = baseW / targetRatio; }

      const cropW = baseW / state.zoom;
      const cropH = baseH / state.zoom;

      state.centerX = Math.max(cropW / 2, Math.min(state.centerX, img.width - cropW / 2));
      state.centerY = Math.max(cropH / 2, Math.min(state.centerY, img.height - cropH / 2));

      const cropX = state.centerX - cropW / 2;
      const cropY = state.centerY - cropH / 2;

      state.cropW = cropW;
      state.cropH = cropH;

      ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, W, imgAreaH);

      const fadeH = 160;
      const grad = ctx.createLinearGradient(0, imgAreaH - fadeH, 0, imgAreaH);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, imgAreaH - fadeH, W, fadeH);
    }

    const wmText = state.wmVisible ? (state.watermarkText || '').trim() : '';
    const wm = measureWatermark(wmText);
    const wmReserve = (wmText && WM_POSITIONS[state.wmPos].key === 'card-bottom') ? wm.h + 50 : 40;

    // ---- TEXT AREA ----
    const paddingX = 60;
    const maxWidth = W - paddingX * 2;
    ctx.font = `700 ${state.fontSize}px ${FONT_STACK}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    const spaceWidth = ctx.measureText(' ').width;
    const tokens = buildTokens(state.text || '');
    const lines = wrapTokens(ctx, tokens, maxWidth);
    const lineHeight = state.fontSize * 1.3;
    const totalTextHeight = lines.length * lineHeight;
    const textAreaCenterY = splitY + (textAreaH - wmReserve) / 2;
    const startY = textAreaCenterY - totalTextHeight / 2 + lineHeight / 2;

    lines.forEach((line, i) => {
      const lineWidth = line.reduce((sum, t, idx) => sum + t.width + (idx > 0 ? spaceWidth : 0), 0);
      let x = W / 2 - lineWidth / 2;
      const y = startY + i * lineHeight;
      line.forEach(tok => {
        ctx.fillStyle = tok.color;
        ctx.fillText(tok.text, x, y);
        x += tok.width + spaceWidth;
      });
    });

    // ---- WATERMARK ----
    if (wmText) drawWatermark(wmText, wm, imgAreaH);

    const displayRatio = container.clientHeight / H;
    divider.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.top = '0px';
    placeholderHint.style.height = (imgAreaH * displayRatio) + 'px';
    placeholderHint.style.display = state.image ? 'none' : 'flex';
  }

  // ---- Divider drag ----
  let dragging = false;
  function ratioFromClientY(clientY) {
    const rect = container.getBoundingClientRect();
    const frac = (clientY - rect.top) / rect.height;
    return state.mode === 'top' ? Math.max(0.2, Math.min(0.7, frac)) : Math.max(0.3, Math.min(0.8, frac));
  }
  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.splitRatio = ratioFromClientY(e.clientY);
    drawCard();
  });
  divider.addEventListener('pointerup', () => { dragging = false; });
  divider.addEventListener('pointercancel', () => { dragging = false; });

  // ---- Canvas pointer handling ----
  let imgDragging = false;
  let lastX = 0, lastY = 0;

  function toCanvasCoords(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const scale = W / rect.width;
    return { x: (clientX - rect.left) * scale, y: (clientY - rect.top) * scale };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const p = toCanvasCoords(e.clientX, e.clientY);
    const inImg = state.mode === 'top' ? p.y >= state.splitY : p.y < state.splitY;
    if (state.image && inImg) {
      imgDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!imgDragging || !state.image) return;
    const rect = container.getBoundingClientRect();
    const dxDisplay = e.clientX - lastX;
    const dyDisplay = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    const displayScale = rect.width / W;
    const imgAreaH = state.mode === 'top' ? state.imgH : state.splitY;
    const scaleFactorX = (state.cropW / W) / displayScale;
    const scaleFactorY = (state.cropH / imgAreaH) / displayScale;

    state.centerX -= dxDisplay * scaleFactorX;
    state.centerY -= dyDisplay * scaleFactorY;

    drawCard();
  });

  canvas.addEventListener('pointerup', (e) => {
    if (imgDragging) {
      imgDragging = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointercancel', () => { imgDragging = false; });

  document.getElementById('pickImageBtn').addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        state.image = img;
        state.zoom = 1;
        state.centerX = img.width / 2;
        state.centerY = img.height / 2;
        zoomInput.value = 100;
        zoomVal.textContent = 100;
        drawCard();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  factText.addEventListener('input', () => {
    state.text = factText.value;
    drawCard();
  });
  fontSizeInput.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    fontSizeVal.textContent = state.fontSize;
    drawCard();
  });
  zoomInput.addEventListener('input', () => {
    state.zoom = parseInt(zoomInput.value, 10) / 100;
    zoomVal.textContent = zoomInput.value;
    drawCard();
  });
  watermarkInput.addEventListener('input', () => {
    state.watermarkText = watermarkInput.value;
    drawCard();
  });
  document.getElementById('wmSize').addEventListener('input', (e) => {
    state.wmSize = parseInt(e.target.value, 10);
    document.getElementById('wmSizeVal').textContent = state.wmSize;
    drawCard();
  });
  document.getElementById('wmOpacity').addEventListener('input', (e) => {
    state.wmOpacity = parseInt(e.target.value, 10) / 100;
    document.getElementById('wmOpacityVal').textContent = e.target.value;
    drawCard();
  });
  document.getElementById('wmPosBtn').addEventListener('click', (e) => {
    state.wmPos = (state.wmPos + 1) % WM_POSITIONS.length;
    e.currentTarget.textContent = '📍 Position: ' + WM_POSITIONS[state.wmPos].label;
    drawCard();
  });
  document.getElementById('wmToggleBtn').addEventListener('click', (e) => {
    state.wmVisible = !state.wmVisible;
    e.currentTarget.textContent = '👁️ Show: ' + (state.wmVisible ? 'ON' : 'OFF');
    drawCard();
  });

  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.5);max-width:90%;text-align:center;transition:opacity .3s;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.style.opacity = '0'; }, 2600);
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) { toast('Save nahi ho paya'); return; }
      const filename = 'FactCues_' + (state.mode === 'top' ? 'top_' : '') + ratioName + '_' + Date.now() + '.png';

      // Android app: native bridge se gallery (Pictures/FactCues) mein save
      if (window.AndroidSave) {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = String(reader.result).split(',')[1] || '';
          let res = '';
          try { res = window.AndroidSave.save(base64, filename); }
          catch (e) { res = 'error: ' + e.message; }
          toast(res === 'ok' ? '✅ Gallery mein save ho gaya (Pictures/FactCues)' : '⚠️ Save fail: ' + res);
        };
        reader.readAsDataURL(blob);
        return;
      }

      // Browser fallback
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  document.querySelectorAll('#ratioRow button').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = RATIOS[btn.dataset.r];
      W = r.w; H = r.h; ratioName = r.name;
      canvas.width = W; canvas.height = H;
      container.style.aspectRatio = W + ' / ' + H;
      container.style.width = 'min(100%, calc(56vh * ' + (W / H) + '))';
      document.querySelectorAll('#ratioRow button').forEach(b => b.classList.toggle('active', b === btn));
      fontSizeInput.value = r.font;
      fontSizeInput.dispatchEvent(new Event('input'));
      drawCard();
    });
  });

  document.querySelectorAll('#modeRow button').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.m;
      if (m === state.mode) return;
      if (state.mode === 'top') state.splitTop = state.splitRatio; else state.splitClassic = state.splitRatio;
      state.mode = m;
      state.splitRatio = (m === 'top') ? state.splitTop : state.splitClassic;
      document.querySelectorAll('#modeRow button').forEach(b => b.classList.toggle('active', b === btn));
      document.getElementById('ratioRow').style.display = (m === 'top') ? 'none' : 'flex';
      document.querySelector('#ratioRow button[data-r="45"]').click();
      fontSizeInput.min = (m === 'top') ? 30 : 20;
      fontSizeInput.max = (m === 'top') ? 250 : 100;
      document.getElementById('topControls').style.display = (m === 'top') ? 'flex' : 'none';
      fontSizeInput.value = (m === 'top') ? 84 : 52;
      fontSizeInput.dispatchEvent(new Event('input'));
      drawCard();
    });
  });

  function nudgeFont(d) {
    const v = Math.max(+fontSizeInput.min, Math.min(+fontSizeInput.max, (+fontSizeInput.value) + d));
    fontSizeInput.value = v;
    fontSizeInput.dispatchEvent(new Event('input'));
  }
  document.getElementById('topMinus').addEventListener('click', () => nudgeFont(-4));
  document.getElementById('topPlus').addEventListener('click', () => nudgeFont(4));
  document.getElementById('topFitBtn').addEventListener('click', (e) => {
    state.topFit = !state.topFit;
    e.currentTarget.textContent = '↔️ Fit Lines: ' + (state.topFit ? 'ON' : 'OFF');
    drawCard();
  });
  document.getElementById('topShrinkBtn').addEventListener('click', (e) => {
    state.topShrink = !state.topShrink;
    e.currentTarget.textContent = '📏 Auto Shrink: ' + (state.topShrink ? 'ON' : 'OFF');
    drawCard();
  });
  document.getElementById('topGap').addEventListener('input', (e) => {
    state.topGap = parseInt(e.target.value, 10) / 100;
    document.getElementById('topGapVal').textContent = state.topGap.toFixed(2).replace(/0$/, '');
    drawCard();
  });

  window.addEventListener('resize', drawCard);
  window.addEventListener('load', drawCard);
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('700 52px "Noto Sans Devanagari"'),
      document.fonts.load('700 52px "Poppins"'),
      document.fonts.load('400 84px "Anton"')
    ]).catch(() => {}).then(drawCard);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawCard);
  }
  drawCard();
</script>
</body>
</html>
